# This is a goreleaser config for nexus3-go.
# Make sure to check the documentation at https://goreleaser.com

version: 2

before:
  hooks:
    # A release must not mutate go.mod/go.sum (CI enforces `go mod tidy`
    # cleanliness), so only verify the module cache instead of tidying.
    - go mod verify

builds:
  - id: nexus3-go
    main: ./cmd/nexus3-go
    binary: nexus3-go
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

upx:
  - enabled: true
    compress: best
    lzma: true
    # Scope UPX to Linux only — macOS Gatekeeper rejects upx-packed Mach-O
    # binaries, and upx support for darwin/arm64 is unreliable.
    goos:
      - linux

archives:
  - id: nexus3-go
    ids: [nexus3-go]
    formats: tar.gz
    name_template: "nexus3-go_{{.Os}}_{{.Arch}}"

dockers_v2:
  - id: nexus3-go
    ids: [nexus3-go]
    dockerfile: Dockerfile
    images:
      - "ghcr.io/m0rf30/nexus3-go"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "https://github.com/M0Rf30/nexus3-go"

checksum:
  name_template: "checksums.txt"

changelog:
  # Changelog generation implementation to use.
  use: github

  # Sorts the changelog by the commit's messages.
  sort: asc

  # Max commit hash length to use in the changelog.
  abbrev: -1

  # Group commits messages by given regex and title.
  groups:
    - title: 🚀 Features
      regexp: '^.*?feat(\([[:word:]/.-]+\))??!?:.+$'
      order: 0
    - title: 🐛 Bug Fixes
      regexp: '^.*?fix(\([[:word:]/.-]+\))??!?:.+$'
      order: 1
    - title: ⚡ Performance
      regexp: '^.*?perf(\([[:word:]/.-]+\))??!?:.+$'
      order: 2
    - title: ♻️  Refactor
      regexp: '^.*?refactor(\([[:word:]/.-]+\))??!?:.+$'
      order: 3
    - title: 📘 Documentation
      regexp: '^.*?docs(\([[:word:]/.-]+\))??!?:.+$'
      order: 4
    - title: 🧪 Tests
      regexp: '^.*?test(\([[:word:]/.-]+\))??!?:.+$'
      order: 5
    - title: 🔧 CI & Build
      regexp: '^.*?(ci|build)(\([[:word:]/.-]+\))??!?:.+$'
      order: 6
    - title: 🧰 Miscellaneous
      order: 999
  filters:
    exclude:
      - '^Merge '
      - '^wip:'
      - '^bump:'
      - '^style:'
