# This is a goreleaser config for nexus3-go.
# Make sure to check the documentation at https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: nexus3-go
    main: ./cmd/nexus3-go
    binary: nexus3-go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: nexus3-go
    ids: [nexus3-go]
    formats: tar.gz
    name_template: "nexus3-go_{{.Os}}_{{.Arch}}"

dockers:
  - image_templates:
      - "ghcr.io/m0rf30/nexus3-go:{{ .Version }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/M0Rf30/nexus3-go"
  - image_templates:
      - "ghcr.io/m0rf30/nexus3-go:{{ .Version }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/M0Rf30/nexus3-go"

docker_manifests:
  - name_template: "ghcr.io/m0rf30/nexus3-go:{{ .Version }}"
    image_templates:
      - "ghcr.io/m0rf30/nexus3-go:{{ .Version }}-amd64"
      - "ghcr.io/m0rf30/nexus3-go:{{ .Version }}-arm64"
  - name_template: "ghcr.io/m0rf30/nexus3-go:latest"
    image_templates:
      - "ghcr.io/m0rf30/nexus3-go:{{ .Version }}-amd64"
      - "ghcr.io/m0rf30/nexus3-go:{{ .Version }}-arm64"

checksum:
  name_template: "checksums.txt"

changelog:
  # Changelog generation implementation to use.
  use: github

  # Sorts the changelog by the commit's messages.
  sort: asc

  # Max commit hash length to use in the changelog.
  abbrev: -1

  # Group commits messages by given regex and title.
  groups:
    - title: 🚀 Features
      regexp: '^.*?feat(\([[:word:]/.-]+\))??!?:.+$'
      order: 0
    - title: 🐛 Bug Fixes
      regexp: '^.*?fix(\([[:word:]/.-]+\))??!?:.+$'
      order: 1
    - title: ⚡ Performance
      regexp: '^.*?perf(\([[:word:]/.-]+\))??!?:.+$'
      order: 2
    - title: ♻️  Refactor
      regexp: '^.*?refactor(\([[:word:]/.-]+\))??!?:.+$'
      order: 3
    - title: 📘 Documentation
      regexp: '^.*?docs(\([[:word:]/.-]+\))??!?:.+$'
      order: 4
    - title: 🧪 Tests
      regexp: '^.*?test(\([[:word:]/.-]+\))??!?:.+$'
      order: 5
    - title: 🔧 CI & Build
      regexp: '^.*?(ci|build)(\([[:word:]/.-]+\))??!?:.+$'
      order: 6
    - title: 🧰 Miscellaneous
      order: 999
  filters:
    exclude:
      - '^Merge '
      - '^wip:'
      - '^bump:'
      - '^style:'
